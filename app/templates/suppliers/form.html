{% extends "base.html" %}
{% block title %}Supplier{% endblock %}
{% block heading %}{{ "Edit supplier" if supplier else "New supplier" }}{% endblock %}
{% block content %}
<form class="card" method="post" style="max-width:640px">
  <label>Name</label><input name="name" value="{{ supplier.name if supplier else '' }}" required>
  <div class="row">
    <div><label>Contact</label><input name="contact_name" value="{{ supplier.contact_name if supplier else '' }}"></div>
    <div><label>Email</label><input name="email" value="{{ supplier.email if supplier else '' }}"></div>
    <div><label>Phone</label><input name="phone" value="{{ supplier.phone if supplier else '' }}"></div>
  </div>
  <label>Address</label><input name="address" value="{{ supplier.address if supplier else '' }}">
  <div class="row">
    <div><label>Lead time (days)</label><input type="number" name="lead_time_days" value="{{ supplier.lead_time_days if supplier else 7 }}"></div>
    <div><label>Payment terms</label><input name="payment_terms" value="{{ supplier.payment_terms if supplier else 'Net 30' }}"></div>
  </div>
  <p><button type="submit">Save</button></p>
</form>
{% endblock %}
